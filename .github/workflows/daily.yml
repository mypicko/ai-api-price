# 每日：抓取价格 → 提交 data/ → 构建网站 → 部署 GitHub Pages（DEV_DOCUMENT §2.2、§6.1、§8.2）
# 抓取与部署必须在同一个 workflow：GITHUB_TOKEN 推送的提交不会触发其他 workflow。
name: daily

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = 北京时间 08:00（GitHub 可能延迟 5~30 分钟）
  workflow_dispatch:
    inputs:
      only:
        description: "只运行这些源（逗号分隔，留空 = 全部）"
        required: false
        default: ""
      notify:
        description: "是否推送飞书"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 缓存 Playwright 浏览器
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 安装 Chromium
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            pnpm --filter @aipb/pipeline exec playwright install chromium
          fi
          pnpm --filter @aipb/pipeline exec playwright install-deps chromium

      - name: 读取 Pages 地址
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 运行价格管线
        id: pipeline
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS }}
          NOTIFY_ON_SUCCESS: ${{ vars.NOTIFY_ON_SUCCESS }}
          ANOMALY_THRESHOLD: ${{ vars.ANOMALY_THRESHOLD }}
          STALE_ALERT_DAYS: ${{ vars.STALE_ALERT_DAYS }}
          STALE_WARN_DAYS: ${{ vars.STALE_WARN_DAYS }}
          FX_FALLBACK_RATE: ${{ vars.FX_FALLBACK_RATE }}
          SOURCES_ENABLED: ${{ vars.SOURCES_ENABLED }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          # 手动输入通过环境变量传入，避免脚本注入
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_NOTIFY: ${{ inputs.notify }}
        run: |
          args=()
          if [ -n "$INPUT_ONLY" ]; then args+=(--only "$INPUT_ONLY"); fi
          if [ "$INPUT_NOTIFY" = "false" ]; then args+=(--no-notify); fi
          pnpm pipeline run "${args[@]}"

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore(data): $(date +%F) 价格更新"
            git pull --rebase --autostash
            git push
          fi

      - name: 构建网站
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
          # 可选访问统计（不使用 Cookie）；未设置时不加载任何统计脚本
          ANALYTICS_PROVIDER: ${{ vars.ANALYTICS_PROVIDER }}
          ANALYTICS_TOKEN: ${{ vars.ANALYTICS_TOKEN }}
          ANALYTICS_SCRIPT_URL: ${{ vars.ANALYTICS_SCRIPT_URL }}
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/site/dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
